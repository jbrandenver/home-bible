<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Our Home Folder mark — engraved house + folder + check, single-ink line art -->
  <g stroke="#F4EEDD" stroke-linecap="round" stroke-linejoin="round">
    <!-- chimney (left roof slope) -->
    <path d="M14.5 22 V10 H21 V16.3" stroke-width="3"/>
    <!-- roof -->
    <path d="M7 29 L32 7 L57 29" stroke-width="3.2"/>
    <!-- inner engraved roof rule -->
    <path d="M12 27.6 L32 10.4 L52 27.6" stroke-width="1.2" opacity="0.55"/>
    <!-- walls + base -->
    <path d="M11.5 26 V55.5 H52.5 V26" stroke-width="3.2"/>
    <!-- folder -->
    <path d="M16.5 50.5 V32.5 H25.5 L28.5 35.5 H47.5 V50.5 Z" stroke-width="2.8"/>
    <!-- check -->
    <path d="M24.5 42.5 L30.5 48 L43.5 31" stroke-width="4"/>
  </g>
</svg>
