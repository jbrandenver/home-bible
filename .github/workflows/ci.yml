name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # security:audit refuses to run without ripgrep rather than reporting a
      # pass it never verified, so install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Boots the build just made and asserts every important route still
      # renders. typecheck/lint/vitest all pass while a page throws on render,
      # and `next build` succeeds for routes it never prerenders — this is the
      # only step that proves the pages actually come up.
      - run: pnpm smoke
      - run: pnpm security:audit
      # Keeps the postcss/sharp overrides honest: a new advisory in a
      # production dependency fails the build rather than waiting for the next
      # manual audit.
      - run: pnpm audit --prod
